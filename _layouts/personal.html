<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: 'Patton Chen, Ph.D. student in Public Policy at Harvard Kennedy School.' }}">
    <title>{% if page.title %}{{ page.title }} | {% endif %}Patton Chen</title>
    <link rel="icon" type="image/png" href="{{ '/assets/images/favicon-32x32.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/personal.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <div class="site-shell site-header__inner">
        <a class="site-brand" href="{{ '/about.html' | relative_url }}" aria-label="Patton Chen home">
          <span class="site-brand__name">Patton Chen</span>
          <span class="site-brand__role">Public Policy · Economics</span>
        </a>
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="{{ '/about.html' | relative_url }}" aria-current="page">Home</a>
          <a href="#research">Research</a>
          <a href="{{ '/CV%20may%202025.pdf' | relative_url }}" target="_blank" rel="noopener">CV</a>
          <a href="#contact">Contact</a>
        </nav>
      </div>
    </header>

    <main class="site-shell page-content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="site-shell site-footer__inner">
        <span>© {{ 'now' | date: '%Y' }} Patton Chen</span>
        <a href="mailto:pattonchen@fas.harvard.edu">pattonchen@fas.harvard.edu</a>
      </div>
    </footer>
  </body>
</html>
