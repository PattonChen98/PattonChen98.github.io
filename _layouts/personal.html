<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: 'Patton Chen, Ph.D. student in Public Policy at Harvard Kennedy School.' }}">
    <title>{% if page.title %}{{ page.title }} | {% endif %}Patton Chen</title>
    <link rel="icon" type="image/png" href="{{ '/assets/images/favicon-32x32.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/personal.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <div class="site-shell">
        <a class="site-title" href="{{ '/about.html' | relative_url }}">Patton Chen</a>
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="{{ '/about.html' | relative_url }}" {% if page.nav == 'home' %}aria-current="page"{% endif %}>Home</a>
          <a href="{{ '/bio.html' | relative_url }}" {% if page.nav == 'bio' %}aria-current="page"{% endif %}>Bio/CV</a>
          <a href="{{ '/publications.html' | relative_url }}" {% if page.nav == 'papers' %}aria-current="page"{% endif %}>Papers</a>
          <a href="{{ '/teaching.html' | relative_url }}" {% if page.nav == 'teaching' %}aria-current="page"{% endif %}>Teaching</a>
          <a href="{{ '/more.html' | relative_url }}" {% if page.nav == 'more' %}aria-current="page"{% endif %}>More</a>
        </nav>
      </div>
    </header>

    <main class="site-shell page-content">
      {{ content }}
    </main>
  </body>
</html>
